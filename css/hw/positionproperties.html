<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
}


.topleft {
  position: absolute;
  top: 8px;
  left: 16px;
  font-size: 20px;
}
.topright {
  position: absolute;
  top: 8px;
  right: 16px;
  font-size: 20px;
}
.center {
  position: absolute;
  top: 50%;
  width:100%;
  text-align: center;
  font-size: 20px;
}
.bottomright {
  position: absolute;
  bottom: 8px;
  right: 16px;
  font-size: 20px;
}
 .bottomleft {
  position: absolute;
  bottom: 8px;
  left: 16px;
  font-size: 20px;
}
.text-left {
            position:absolute;
            top: 50%;
            width: 100%;
            text-align: left;
            font-size: 24px;
            margin-top: 20px;
        }
        .text-right {
            position:absolute;
            top: 50%;
            width: 100%;
            text-align: right;
            font-size: 24px;
            margin-top: 20px;
        }
        .text-top {
            position:absolute;
            top: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
        }
        .text-bottom {
            position:absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }




img { 
  width: 100%;
  
  opacity: 0.5;
}


</style>
</head>
<body>


<div class="container">
<img src="photo.jpeg" alt="Cinque Terre" width="1000" height="800" >
<div class="topleft">Prince Nautiyal</div>
<div class="topright">Prince Nautiyal</div>
<div class="center">Prince Nautiyal</div>
<div class="bottomright">Prince Nautiyal</div>
<div class="bottomleft">Prince Nautiyal</div>
<div class="text-left">Prince Nautiyal</div>
<div class="text-right">Prince Nautiyal</div>
<div class="text-top">Prince Nautiyal</div>
<div class="text-bottom">Prince Nautiyal</div>








</div>

</body>
</html>
