<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width:100%;
            height: 100vh;
            padding:25px;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap:15px;

            
           
           
            
            
          
        }
        .card img{
            width:100%;
            height:220px;
            object-fit: cover;
            border:2px solid black;
            
           }
        .card{
            display: grid;
            gap:15px;
        }
        @media only screen and (max-width: 600px) {
            .container{
                width:100vw;
                height:100vh;
                
                grid-template-columns:repeat(1,1fr) ;
                align-items: center;
                
            }
            
        }
        
    </style>
    
</head>
<body>
    <div class="container">
        <div class="card"><img src="assetsfile/photo1.jpeg" height="100px" width="100px"> </div>
        <div class="card"><img src="assetsfile/photo2.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo3.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo4.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo5.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo6.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo7.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo8.jpeg" height="100px" width="100px"></div>
        <div class="card"><img src="assetsfile/photo9.jpeg" height="100px" width="100px"></div>
    </div>
</body>
</html>
