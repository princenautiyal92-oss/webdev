<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            position:absolute;
            left:0px;
            top:0px;
            z-index:-1;
        }
    </style>
</head>

<body>
    <img src="butterflyimg.avif" alt="butterfly image">
    <h1>THIS IS A FILE</h1>
    <p>Because the image has z-index of -1, it will be placed behind the text.</p>
</body>
</html>
