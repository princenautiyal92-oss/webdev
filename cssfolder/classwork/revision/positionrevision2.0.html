<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            background-color: blue;
            width:500px;
            height:400px;
        }
        .topleft {
            position: absolute;
             top: 8px;
             left: 16px;
             font-size: 20px;
            }
        .topright {
            position: absolute;
            top: 8px;
            right: 16px;
            font-size: 20px;
        }
        .left {
            position: absolute;
            bottom: 8px;
            left: 16px;
            font-size: 20px;
        }
        .right{
            position: absolute;
            bottom:8px;
            right:16px;
            font-size:20px;
        }
        .bottomcenter{
            position: absolute;
            bottom:8px;
            left:50%;
            
            font-size:20px;
        }
        .topcenter{
            position: absolute;
            top:8px;
            left:50%;
            
            font-size:20px;
        }
        .leftcenter{
            position:absolute;
            top:50%;
            left:16px;
            font-size:20px;
        }
        .rightcenter{
            position:absolute;
            top:50%;
            right:16px;
            font-size:20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="left">Prince</div>
        <div class="right">Prince</div>
        <div class="topleft">Prince</div>
        <div class="topright">Prince</div>
        <div class="topcenter">Prince</div>
        <div class="bottomcenter">Prince</div>
        <div class="leftcenter">Prince</div>
        <div class="rightcenter">Prince</div>

        
    </div>
</body>
</html>
