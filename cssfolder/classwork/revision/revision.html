<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
        
        
        .container {
            position: relative;
            
            background-color: blue;
            width:500px;
            height:400px;
            text-align: end;
            border-radius: 10px;
            
          
            
        }
        .box{
            position: absolute;
            background-color: green;
            bottom:0px;
            width: 200px;
            height:200px;
            border-radius: 10px;
            
         }
        
    </style>
</head>
<body>
    <div class="container">DIV1 &nbsp;
        <div class="box">DIV2 &nbsp;</div>
        </div>                      
    
    
    
</body>
</html>
